[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadow-mirror"
description = "Referential introspection for test planning and coverage mapping — the five-level semantic-coverage engine (sm), MCP server, and SM-0..SM-6 reference data model."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "acidblock" }]
keywords = ["testing", "coverage", "test-planning", "validation", "scientific-method"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dynamic = ["version"]

# Runtime stays dependency-free (C1): the engine *consumes* coverage.py and
# pytest out-of-process (see shadow_mirror/_run.py), so they are tools, not
# import-time dependencies.
[project.optional-dependencies]
engine = ["coverage>=7", "pytest>=7"]
test = ["pytest>=7", "coverage>=7", "tomli>=2; python_version < '3.11'"]
# Upper-bounded: mcp 2.0 removed the vendored FastMCP (`mcp.server.fastmcp`)
# that mcp_server.py is written against. Migration to 2.x is tracked in issues.
mcp = ["mcp>=1.0,<2"]
# JS adapter: tree-sitter parses source in-process; vitest/Istanbul are consumed
# out-of-process (npx) in the target project, so they are not Python deps.
js = ["tree-sitter>=0.23", "tree-sitter-javascript>=0.23"]
# TS adapter: same shared base, TypeScript grammar (a JS grammar superset). vitest
# transpiles .ts out-of-process (esbuild), so again no extra Python dep beyond the grammar.
ts = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]

[project.scripts]
sm = "shadow_mirror.cli:main"
sm-mcp = "shadow_mirror.mcp_server:main"

[project.urls]
Homepage = "https://github.com/acidblock/shadow-mirror"
Repository = "https://github.com/acidblock/shadow-mirror"

[tool.hatch.version]
path = "shadow_mirror/_version.py"

[tool.ruff.lint]
# The lint bar is ruff's classic default set, made explicit so a ruff upgrade
# cannot silently move it (0.16 widened the defaults with formatter-adjacent
# rules — import/__all__ sorting — that fight this repo's hand-formatted style;
# there is deliberately no formatter here, see CI).
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["shadow_mirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: engine tests that spawn coverage.py/pytest subprocesses (deselect with -m 'not slow')"]
