name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Empty on fork PRs (secrets are unreadable there) — the C4 gate then skips
      # instead of failing every external contribution. The `secrets` context is
      # not allowed in step `if:` expressions, hence the job-level env indirection.
      C4_DENYLIST: ${{ secrets.C4_DENYLIST }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node (vitest runner for the JS adapter)
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Python deps (engine + JS/TS adapters + ruff)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,js,ts,mcp]" "ruff==0.16.0"

      # The cross-language conformance tests run vitest against this fixture. The TS
      # mirror lives in its ts/ subdir and reuses these node_modules (esbuild
      # transpiles .ts), so one `npm ci` installs the locked vitest + istanbul for
      # both JS and TS — the gate RUNS, not skips.
      - name: Install JS/TS conformance fixture deps
        working-directory: tests/fixtures/conformance_js
        run: npm ci

      - name: Lint (ruff check — no formatter, per the project's bar)
        run: ruff check .

      # The C4 foreign-project denylist is kept OUT of the repo (it would reveal the
      # names C4 hides). Materialize it from the C4_DENYLIST repository secret into
      # the gitignored incoming/ quarantine; SM_REQUIRE_C4 (below) then fails loud if
      # it is missing, so the gate can never silently skip in CI. Fork PRs cannot
      # read secrets, so there the gate skips (its default posture) instead of
      # failing every external contribution; push builds still enforce it.
      - name: Materialize the C4 denylist (kept out of the repo)
        if: env.C4_DENYLIST != ''
        run: |
          mkdir -p incoming
          printf '%s\n' "$C4_DENYLIST" > incoming/c4-denylist.txt

      # SM_REQUIRE_JS=1 turns the conformance skip-guard into a hard failure, so a
      # missing tree-sitter wheel / npm install / node turns CI red instead of
      # green-with-skips. SM_REQUIRE_C4=1 does the same for the C4 denylist gate
      # (set only when the secret is readable — see above).
      - name: Test (full suite incl. slow + enforced JS conformance + C4 gate)
        env:
          SM_REQUIRE_JS: "1"
          SM_REQUIRE_C4: ${{ env.C4_DENYLIST != '' && '1' || '' }}
        run: python -m pytest tests/ -p no:cacheprovider -q
