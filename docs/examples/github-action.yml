# Shadow Mirror — PR semantic-coverage annotation  (TEMPLATE — copy, don't run as-is)
#
# This file lives in docs/ ON PURPOSE: it is NOT a live workflow for this repo. To
# use it, copy it to `.github/workflows/shadow-mirror.yml` in YOUR project and adapt
# MODULE / TESTS. It is an UNVERIFIED EXAMPLE — review it before enabling, since it
# posts PR comments using GITHUB_TOKEN. The tested, supported core is the CLI it
# calls (`sm map --json`, `sm delta --markdown`); the YAML wiring is illustrative.
#
# What it does: build a semantic-coverage map for the PR's base and head, diff them
# with `sm delta --markdown`, and post the result as ONE sticky PR comment (updated
# in place on each push, via the hidden `<!-- shadow-mirror-delta -->` marker that
# `sm delta --markdown` emits — so pushes don't spam new comments).

name: shadow-mirror
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write          # to post / update the sticky comment

jobs:
  semantic-coverage-delta:
    runs-on: ubuntu-latest
    env:
      MODULE: src/your_module.py            # <-- adapt
      TESTS: tests/test_your_module.py      # <-- adapt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # need base + head revisions

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shadow Mirror + your project (sm runs your own test suite)
        run: |
          python -m pip install --upgrade pip
          pip install "shadow-mirror[engine]"
          pip install -e .                  # your package + its TEST dependencies

      - name: Map head (the PR)
        run: sm map "$MODULE" --tests "$TESTS" --json > head.json

      - name: Map base (the target branch)
        run: |
          git worktree add /tmp/sm-base "${{ github.event.pull_request.base.sha }}"
          (
            cd /tmp/sm-base
            pip install -e . >/dev/null 2>&1 || true
            sm map "$MODULE" --tests "$TESTS" --json
          ) > base.json

      - name: Compute the delta (markdown for the PR comment)
        run: sm delta base.json head.json --markdown > comment.md

      # Optional gate — uncomment to FAIL the PR on a regression or a new gap on a
      # complex node (off by default, per the additive-onboarding principle):
      # - name: Gate
      #   run: sm delta base.json head.json --fail-on-regression  # or --gate-complexity 8

      - name: Post or update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Find an existing comment carrying our marker and PATCH it; else create one.
          # NOTE: the comment-id lookup below is illustrative — verify the `gh` JSON
          # shape against your `gh` version, or swap in a maintained sticky-comment
          # action if you prefer.
          marker='<!-- shadow-mirror-delta -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" \
                 --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md
          else
            gh pr comment "$PR" --body-file comment.md
          fi
